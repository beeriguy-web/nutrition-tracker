<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#16a34a">
<title>מעקב תזונה</title>
<script>
const _manifest = {name:'מעקב תזונה',short_name:'תזונה',start_url:'./',display:'standalone',background_color:'#16a34a',theme_color:'#16a34a',dir:'rtl',lang:'he',
icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%2316a34a'/%3E%3Ctext x='96' y='135' font-size='110' text-anchor='middle'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E",sizes:'192x192',type:'image/svg+xml'}]};
document.addEventListener('DOMContentLoaded',()=>{const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(_manifest)],{type:'application/json'}));document.head.appendChild(l);});
</script>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%2316a34a'/%3E%3Ctext x='90' y='128' font-size='105' text-anchor='middle'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
:root{
  --bg:#f4f6fa;--white:#fff;--border:#dde2ec;--border-light:#eef1f7;
  --text:#1a1f36;--text-mid:#4a5568;--text-dim:#8896b3;
  --accent:#16a34a;--accent-light:#f0fdf4;--accent-dark:#15803d;
  --blue:#2563eb;--blue-light:#eff4ff;
  --warn:#f59e0b;--warn-light:#fffbeb;
  --danger:#ef4444;
  --shadow:0 1px 4px rgba(26,31,54,.07);--radius:12px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl;}

.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 16px;padding-top:var(--safe-top);position:sticky;top:0;z-index:50;box-shadow:var(--shadow);}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;height:56px;}
.logo{font-size:16px;font-weight:800;color:var(--accent);}
.logo span{color:var(--text-dim);font-weight:400;font-size:13px;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.excel-btn{background:white;border:1px solid var(--border);border-radius:8px;height:34px;padding:0 12px;font-family:'Heebo',sans-serif;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--text-mid);}
.excel-btn:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent);}

.stats-bar{display:flex;gap:8px;padding:10px 16px;background:var(--white);border-bottom:1px solid var(--border-light);}
.stat-chip{flex:1;background:var(--bg);border-radius:10px;padding:8px 10px;text-align:center;}
.stat-chip .sv{font-size:20px;font-weight:800;color:var(--text);}
.stat-chip .sl{font-size:10px;color:var(--text-dim);font-weight:600;margin-top:1px;}
.stat-chip.green .sv{color:var(--accent);}
.stat-chip.blue .sv{color:var(--blue);}
.stat-chip.warn .sv{color:var(--warn);}

.container{padding:14px 14px calc(80px + var(--safe-bottom));}

/* VOICE CARD */
.voice-card{background:linear-gradient(135deg,#14532d,#16a34a);border-radius:16px;padding:16px 18px;margin-bottom:12px;color:white;box-shadow:0 4px 16px rgba(22,163,74,.3);}
.voice-top{display:flex;align-items:center;gap:14px;}
.mic-btn{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);cursor:pointer;font-size:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:white;touch-action:manipulation;transition:transform .15s;}
.mic-btn:active{transform:scale(.93);}
.mic-btn.listening{background:#ef4444;border-color:#fca5a5;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5);}50%{box-shadow:0 0 0 14px rgba(239,68,68,0);}}
.voice-info{flex:1;}
.voice-title{font-size:14px;font-weight:700;}
.voice-hint{font-size:11px;opacity:.7;margin-top:2px;}
.voice-st{font-size:12px;font-weight:600;margin-top:6px;opacity:.9;}
.voice-transcript{background:rgba(255,255,255,.15);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:8px;min-height:32px;line-height:1.5;display:none;}

/* MEAL PICKER */
.meal-picker{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.meal-pill{padding:6px 12px;border-radius:99px;border:1.5px solid var(--border);background:var(--white);font-family:'Heebo',sans-serif;font-size:12px;font-weight:700;color:var(--text-dim);cursor:pointer;transition:all .15s;touch-action:manipulation;}
.meal-pill.active{background:var(--accent);color:white;border-color:var(--accent);}

/* MANUAL INPUT */
.search-cal-btn{background:var(--blue-light);border:1.5px solid var(--blue);border-radius:var(--radius);padding:0 14px;font-family:'Heebo',sans-serif;font-weight:700;font-size:13px;color:var(--blue);cursor:pointer;white-space:nowrap;height:46px;flex-shrink:0;}
.search-cal-btn:hover{background:#dbeafe;}
.unknown-banner{background:var(--warn-light);border:1px solid #fde68a;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:13px;color:#92400e;display:none;align-items:center;justify-content:space-between;gap:8px;}
.unknown-banner.show{display:flex;}
.manual-row{display:flex;gap:8px;margin-bottom:12px;}
.manual-row input{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;font-family:'Heebo',sans-serif;font-size:14px;color:var(--text);direction:rtl;}
.manual-row input:focus{outline:none;border-color:var(--accent);}
.input-food{flex:1;}
.input-cal{width:80px;}
.btn-add{background:var(--accent);color:white;border:none;border-radius:var(--radius);padding:0 16px;font-family:'Heebo',sans-serif;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;height:46px;flex-shrink:0;}

/* SUGGESTION CARD */
.suggestion-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px;border-right:4px solid var(--warn);display:none;}
.suggestion-card.show{display:block;}
.sug-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.sug-title{font-size:13px;font-weight:700;color:var(--warn);}
.sug-close{background:none;border:none;cursor:pointer;font-size:16px;color:var(--text-dim);}
.sug-source{font-size:10px;color:var(--text-dim);margin-bottom:10px;}
.sug-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-light);}
.sug-item:last-child{border-bottom:none;}
.sug-name{font-size:13px;font-weight:600;}
.sug-portion{font-size:11px;color:var(--text-dim);margin-top:1px;}
.sug-right{text-align:left;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.sug-cal{font-size:14px;font-weight:800;color:var(--accent);}
.sug-save{font-size:10px;color:var(--accent);background:var(--accent-light);border-radius:99px;padding:2px 8px;font-weight:700;}

/* FILTER TABS */
.filter-tabs{display:flex;background:var(--white);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:12px;gap:4px;}
.ftab{flex:1;padding:9px 6px;border-radius:9px;border:none;background:transparent;font-family:'Heebo',sans-serif;font-size:13px;font-weight:700;color:var(--text-dim);cursor:pointer;transition:all .15s;touch-action:manipulation;}
.ftab.active{background:var(--accent);color:white;box-shadow:0 2px 8px rgba(22,163,74,.3);}

/* DAY HEADER */
.day-header{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 6px;}
.day-label{font-size:13px;font-weight:700;color:var(--text-mid);}
.day-total-badge{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-light);border-radius:99px;padding:3px 12px;}

/* ENTRY CARD */
.entry-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;}
.entry-card.drink{border-right:4px solid var(--blue);}
.entry-icon{font-size:22px;flex-shrink:0;}
.entry-body{flex:1;}
.entry-name{font-size:15px;font-weight:700;line-height:1.3;}
.entry-meta{font-size:11px;color:var(--text-dim);margin-top:2px;}
.entry-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.entry-cal{font-size:20px;font-weight:800;color:var(--accent);}
.entry-cal-unit{font-size:10px;color:var(--text-dim);font-weight:400;}
.entry-cal.drink-cal{color:var(--blue);}
.meal-tag{display:inline-block;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:700;}
.meal-tag.breakfast{background:#fef3c7;color:#d97706;}
.meal-tag.lunch{background:#dbeafe;color:#1d4ed8;}
.meal-tag.dinner{background:#ede9fe;color:#7c3aed;}
.meal-tag.snack{background:#fce7f3;color:#9d174d;}
.meal-tag.drink{background:var(--blue-light);color:var(--blue);}
.del-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:transparent;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex-shrink:0;}
.del-btn:hover{background:#fff1f2;border-color:#fecdd3;color:var(--danger);}

.empty{text-align:center;padding:48px 20px;color:var(--text-dim);}
.empty-icon{font-size:44px;margin-bottom:12px;}
.empty-title{font-size:16px;font-weight:700;color:var(--text-mid);margin-bottom:6px;}

.toast{position:fixed;bottom:calc(90px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(30px);background:#1e293b;color:white;padding:11px 18px;border-radius:100px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:all .3s;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.25);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* MULTI-FOOD CARD */
.multifood-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px;border-right:4px solid var(--blue);display:none;}
.multifood-card.show{display:block;}
.mf-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.mf-title{font-size:13px;font-weight:700;color:var(--blue);}
.mf-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border-light);flex-wrap:wrap;}
.mf-item:last-child{border-bottom:none;}
.mf-item-name{flex:1;font-size:13px;font-weight:600;min-width:120px;}
.mf-item-cal{font-size:13px;font-weight:800;color:var(--accent);min-width:60px;text-align:left;}
.mf-gram-input{width:68px;border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-family:'Heebo',sans-serif;font-size:13px;text-align:center;color:var(--text);}
.mf-gram-input:focus{outline:none;border-color:var(--blue);}
.mf-gram-label{font-size:11px;color:var(--text-dim);}
.mf-remove{background:none;border:none;cursor:pointer;font-size:13px;color:var(--text-dim);padding:2px 4px;flex-shrink:0;}
.mf-remove:hover{color:var(--danger);}
.mf-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-light);}
.mf-total-label{font-size:14px;font-weight:800;color:var(--text);}
.mf-total-label span{color:var(--accent);}
.mf-confirm-btn{background:var(--accent);color:white;border:none;border-radius:10px;padding:9px 18px;font-family:'Heebo',sans-serif;font-weight:700;font-size:13px;cursor:pointer;}
.mf-confirm-btn:hover{background:var(--accent-dark);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="logo">🥗 מעקב תזונה <span>יומי</span></div>
    <div class="topbar-right">
      <button class="excel-btn" onclick="doExport()">📊 ייצא Excel</button>
    </div>
  </div>
</div>

<div class="stats-bar">
  <div class="stat-chip green"><div class="sv" id="st-cal">0</div><div class="sl">קק"ל היום</div></div>
  <div class="stat-chip blue"><div class="sv" id="st-entries">0</div><div class="sl">רשומות</div></div>
  <div class="stat-chip warn"><div class="sv" id="st-days">0</div><div class="sl">ימי מעקב</div></div>
</div>

<div class="container">

  <!-- VOICE -->
  <div class="voice-card">
    <div class="voice-top">
      <button class="mic-btn" id="micBtn" onclick="toggleListen()">🎤</button>
      <div class="voice-info">
        <div class="voice-title">הקלטה קולית</div>
        <div class="voice-hint">אמור מה אכלת או שתית — יחושב אוטומטית</div>
        <div class="voice-st" id="voiceSt">לחץ על המיקרופון להתחלה</div>
      </div>
    </div>
    <div class="voice-transcript" id="voiceTranscript"></div>
  </div>

  <!-- SUGGESTION -->
  <div class="suggestion-card" id="suggestionCard">
    <div class="sug-header">
      <div class="sug-title">💡 חלופות בריאות יותר</div>
      <button class="sug-close" onclick="closeSuggestion()">✕</button>
    </div>
    <div class="sug-source">מבוסס על המלצות משרד הבריאות הישראלי ומומחי תזונה</div>
    <div id="sugItems"></div>
  </div>

  <!-- MEAL TYPE -->
  <div class="meal-picker" id="mealPicker">
    <button class="meal-pill active" data-meal="breakfast" onclick="pickMeal(this)">🌅 בוקר</button>
    <button class="meal-pill" data-meal="lunch" onclick="pickMeal(this)">☀️ צהריים</button>
    <button class="meal-pill" data-meal="dinner" onclick="pickMeal(this)">🌙 ערב</button>
    <button class="meal-pill" data-meal="snack" onclick="pickMeal(this)">🍎 חטיף</button>
    <button class="meal-pill" data-meal="drink" onclick="pickMeal(this)">💧 שתייה</button>
  </div>

  <!-- UNKNOWN FOOD BANNER -->
  <div class="unknown-banner" id="unknownBanner">
    <span id="unknownText">המזון לא נמצא בבסיס הנתונים — הוסף קלוריות ידנית:</span>
    <button class="search-cal-btn" id="searchCalBtn" onclick="searchCalories()">🔍 חפש קלוריות</button>
  </div>

  <!-- MANUAL INPUT -->
  <div class="manual-row">
    <input type="text" class="input-food" id="inputFood" placeholder="מה אכלת / שתית?" onkeydown="if(event.key==='Enter')addEntry()">
    <input type="number" class="input-cal" id="inputCal" placeholder="קק״ל" min="0" onkeydown="if(event.key==='Enter')addEntry()">
    <button class="btn-add" onclick="addEntry()">➕ הוסף</button>
  </div>

  <!-- MULTI-FOOD CARD -->
  <div class="multifood-card" id="multifoodCard">
    <div class="mf-header">
      <div class="mf-title" id="mfTitle">🍽️ כמה אכלת?</div>
      <button class="sug-close" onclick="closeMultifood()">✕</button>
    </div>
    <div id="mfItems"></div>
    <div class="mf-footer">
      <div class="mf-total-label">סה"כ: <span id="mfTotal">0</span> קק"ל</div>
      <button class="mf-confirm-btn" onclick="confirmMultifood()">✅ הוסף</button>
    </div>
  </div>

  <!-- FILTER -->
  <div class="filter-tabs">
    <button class="ftab active" id="fb-today" onclick="setFilter('today')">📋 היום</button>
    <button class="ftab" id="fb-all" onclick="setFilter('all')">📅 כל הימים</button>
  </div>

  <!-- LIST -->
  <div id="entriesList"></div>

</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
// FOOD DATABASE  (Israeli nutrition data)
// format: { keywords, name, cal, portion, alts:[{name,cal,portion,note}] }
// ═══════════════════════════════════════════
const FOOD_DB = [
  // EGGS & DAIRY
  {kw:['ביצה','ביצים','ביצה מקושקשת','ביצה מטוגנת','ביצה קשה','שקשוקה'],name:'ביצה',cal:75,portion:'ביצה אחת (55ג׳)',
   alts:[{name:'חביתה לבנות ביצה בלבד',cal:35,portion:'לבן של 2 ביצים',note:'חצי הקלוריות, אותה חלבון'},
         {name:'גבינה קוטג׳ 5%',cal:55,portion:'100 גרם',note:'מעייפת פחות, עשירה בחלבון'}]},
  {kw:['חביתה'],name:'חביתה',cal:185,portion:'2 ביצים + שמן',
   alts:[{name:'חביתת לבנות + ירקות',cal:80,portion:'3 לבנות ביצה + פלפל עגבנייה',note:'פחות שומן, יותר נפח'},
         {name:'קוטג׳ עם ירקות',cal:90,portion:'150 גרם + ירקות',note:'קר ומהיר, עשיר בחלבון'}]},
  {kw:['גבינה לבנה','גבינה','גבינה 5%','גבינה 9%'],name:'גבינה לבנה',cal:100,portion:'100 גרם (5%)',
   alts:[{name:'קוטג׳ 1%',cal:55,portion:'100 גרם',note:'כמעט חצי קלוריות'},
         {name:'לאבנה 5%',cal:80,portion:'2 כפות',note:'דנסי יותר, מספק לזמן ארוך'}]},
  {kw:['קוטג׳'],name:'קוטג׳',cal:55,portion:'100 גרם',
   alts:[{name:'קוטג׳ 0%',cal:45,portion:'100 גרם',note:'מינוס 10 קלוריות ל-100 גרם'},
         {name:'יוגורט יווני 0%',cal:60,portion:'100 גרם',note:'טעים יותר, אותם ערכים'}]},
  {kw:['יוגורט','יוגורט יווני'],name:'יוגורט',cal:60,portion:'100 גרם (1.5%)',
   alts:[{name:'יוגורט יווני 0%',cal:55,portion:'100 גרם',note:'יותר חלבון, פחות שומן'},
         {name:'קוטג׳ 1%',cal:55,portion:'100 גרם',note:'מספיק, מילוי דומה'}]},
  {kw:['שמנת','שמנת חמוצה'],name:'שמנת חמוצה',cal:160,portion:'100 גרם (15%)',
   alts:[{name:'יוגורט יווני 0%',cal:55,portion:'100 גרם',note:'שליש הקלוריות, יותר חלבון'},
         {name:'לאבנה 5%',cal:80,portion:'2 כפות',note:'טעם קרמי, הרבה פחות שומן'}]},

  // BREAD & GRAINS
  {kw:['לחם','פרוסת לחם','לחם אחיד'],name:'לחם לבן',cal:80,portion:'פרוסה אחת',
   alts:[{name:'לחם שיפון מלא',cal:65,portion:'פרוסה אחת',note:'יותר סיבים, שובע ארוך יותר'},
         {name:'קרקר שיפון',cal:35,portion:'2 קרקרים',note:'פחות פחמימות, קריספי'}]},
  {kw:['לחם מלא','לחם שיפון'],name:'לחם מלא',cal:65,portion:'פרוסה אחת',
   alts:[{name:'קרקר שיפון',cal:35,portion:'2 קרקרים',note:'אותה הנאה, כמעט חצי קלוריות'},
         {name:'עלה חסה כרוטב',cal:5,portion:'עלה גדול',note:'מינימום קלוריות, עוטפים את המלית'}]},
  {kw:['פיתה'],name:'פיתה',cal:270,portion:'פיתה שלמה (90ג׳)',
   alts:[{name:'פיתה דיאט קטנה',cal:130,portion:'פיתה קטנה (50ג׳)',note:'חצי הגודל, חצי הקלוריות'},
         {name:'לחם שיפון x2',cal:130,portion:'2 פרוסות',note:'פחות מחצי הקלוריות, יותר שובע'}]},

// ═══════════════════════════════════════════
// MEAL LOOKUP & MATCHING
// ═══════════════════════════════════════════
function matchWord(text, kw) {
  if (kw.length < 3) return false;
  const i = text.indexOf(kw);
  if (i === -1) return false;
  // Allow Hebrew conjunctions (ו/ב/מ/ל/כ/ש/ה) glued to start of word
  const pre = i === 0 || /[\s,\-\/.(וּבמלכשה]/.test(text[i - 1]);
  const post = i + kw.length >= text.length || /[\s,\-\/.(]/.test(text[i + kw.length]);
  return pre && post;
}

function userFoodToEntry(f) {
  const kws = [f.name];
  const firstWord = f.name.split(/[\s,]/)[0];
  if (firstWord && firstWord !== f.name && firstWord.length >= 3) kws.push(firstWord);
  return { kw: kws, name: f.name, cal: f.cal, portion: 'מנה', alts: [], isUserFood: true };
}

function saveUserFood(name, cal) {
  const idx = userFoods.findIndex(f => f.name === name.trim());
  if (idx >= 0) { userFoods[idx].cal = cal; } else { userFoods.push({ name: name.trim(), cal }); }
  localStorage.setItem('user_foods', JSON.stringify(userFoods));
}

function findFood(text) {
  // User foods take absolute priority
  for (const f of userFoods) {
    const e = userFoodToEntry(f);
    if (e.kw.some(k => matchWord(text, k))) return e;
  }
  // Main DB: prefer the entry with the LONGEST matching keyword
  let best = null, bestLen = 0;
  for (const f of FOOD_DB) {
    for (const k of f.kw) {
      if (k.length > bestLen && matchWord(text, k)) { best = f; bestLen = k.length; }
    }
  }
  return best;
}

function findAllFoods(text) {
  // Collect best (longest) keyword candidate per entry
  const candidates = [];
  const allDB = [...userFoods.map(userFoodToEntry), ...FOOD_DB];
  for (const f of allDB) {
    let bestK = null, bestI = -1;
    for (const k of f.kw) {
      if (k.length < 3) continue;
      const i = text.indexOf(k);
      if (i === -1) continue;
      const pre = i === 0 || /[\s,\-\/.(וּבמלכשה]/.test(text[i - 1]);
      const post = i + k.length >= text.length || /[\s,\-\/.(]/.test(text[i + k.length]);
      if (!pre || !post) continue;
      if (!bestK || k.length > bestK.length) { bestK = k; bestI = i; }
    }
    if (bestK) candidates.push({ food: f, keyword: bestK, pos: bestI, len: bestK.length });
  }
  // Sort by position, then longer keyword wins at same position
  candidates.sort((a, b) => a.pos - b.pos || b.len - a.len);
  // Greedy select non-overlapping matches
  const used = new Array(text.length).fill(false);
  const results = [];
  for (const c of candidates) {
    let overlap = false;
    for (let p = c.pos; p < c.pos + c.len; p++) { if (used[p]) { overlap = true; break; } }
    if (overlap) continue;
    for (let p = c.pos; p < c.pos + c.len; p++) used[p] = true;
    results.push(c);
  }
  return results.sort((a, b) => a.pos - b.pos);
}

  const n = new Date();

}
function fmtDateHe(iso) {
  const [y,m,d] = iso.split('-');
  const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const months = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  const dt = new Date(`${iso}T12:00:00`);
  return `יום ${days[dt.getDay()]}, ${parseInt(d)} ${months[parseInt(m)-1]}`;
}

// Auto-detect meal based on time of day
function autoMeal() {
  const h = new Date().getHours();
  if (h < 10) return 'breakfast';
  if (h < 14) return 'lunch';
  if (h < 19) return 'dinner';
  return 'snack';
}

// ═══════════════════════════════════════════
// VOICE RECOGNITION
// ═══════════════════════════════════════════
function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { document.getElementById('voiceSt').textContent = '⚠️ נא פתח ב-Chrome'; return; }
  recog = new SR();
  recog.lang = 'he-IL';
  recog.continuous = false;
  recog.interimResults = true;
  recog.onresult = e => {
    let fin = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) fin += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    const txt = fin || interim;
    const tr = document.getElementById('voiceTranscript');
    tr.style.display = 'block';
    tr.textContent = txt;
    if (fin) processVoice(fin.trim());
  };
  recog.onerror = () => { stopListen(); setSt('לחץ להקלטה'); };
  recog.onend = () => { if (listening) stopListen(); };
}

function toggleListen() { listening ? stopListen() : startListen(); }

function startListen() {
  if (!recog) { toast('נא פתח ב-Chrome'); return; }
  listening = true;
  document.getElementById('micBtn').classList.add('listening');
  document.getElementById('micBtn').textContent = '⏹';
  setSt('🔴 מאזין...');
  document.getElementById('voiceTranscript').style.display = 'none';
  document.getElementById('voiceTranscript').textContent = '';
  try { recog.start(); } catch(e) {}
}

function stopListen() {
  listening = false;
  document.getElementById('micBtn').classList.remove('listening');
  document.getElementById('micBtn').textContent = '🎤';
  setSt('לחץ להקלטה');
  try { recog.stop(); } catch(e) {}
}

function setSt(t) { document.getElementById('voiceSt').textContent = t; }

function processVoice(text) {
  stopListen();
  setSt('✅ זוהה: ' + text.substring(0, 30));
  hideUnknownBanner();

  const matches = findAllFoods(text);

  if (matches.length === 0) {
    document.getElementById('inputFood').value = text;
    document.getElementById('inputCal').value = '';
    document.getElementById('inputCal').focus();
    showUnknownBanner(text);
    return;
  }

  if (matches.length === 1 && !isMohEntry(matches[0].food)) {
    const food = matches[0].food;
    addEntryData({ name: food.name + (food.name !== text ? ` (${text})` : ''), cal: food.cal, fromDB: food });
    return;
  }

  const title = matches.length === 1
    ? `🥗 כמה גרם אכלת מ"${matches[0].food.name.split(',')[0]}"?`
    : `🍽️ זיהיתי ${matches.length} מאכלים — הוסף כמות:`;
  document.getElementById('mfTitle').textContent = title;
  showMultifoodCard(matches);
}

function showUnknownBanner(foodName) {
  const banner = document.getElementById('unknownBanner');
  document.getElementById('unknownText').textContent = `"${foodName}" לא נמצא בבסיס הנתונים — מלא קלוריות ידנית:`;
  banner.classList.add('show');
  // Store food name for search
  banner.dataset.food = foodName;
}

function hideUnknownBanner() {
  document.getElementById('unknownBanner').classList.remove('show');
}

function searchCalories() {
  const banner = document.getElementById('unknownBanner');
  const food = banner.dataset.food || document.getElementById('inputFood').value.trim() || '';
  const query = encodeURIComponent(food + ' קלוריות ל100 גרם');
  // Open Israeli health / calorie search
  window.open('https://www.foodsdictionary.co.il/Search?q=' + query, '_blank');
}

function addEntry() {
  const name = document.getElementById('inputFood').value.trim();
  const calInput = parseInt(document.getElementById('inputCal').value) || 0;
  if (!name) { toast('⚠️ נא להזין שם מזון'); return; }

  const matches = findAllFoods(name);

  if (matches.length === 0) {
    if (calInput === 0 && !confirm('קלוריות לא הוזנו — להמשיך עם 0?')) return;
    if (calInput > 0) saveUserFood(name, calInput);
    addEntryData({ name, cal: calInput, fromDB: null });
    document.getElementById('inputFood').value = '';
    document.getElementById('inputCal').value = '';
    hideUnknownBanner();
    return;
  }

  if (matches.length === 1 && !isMohEntry(matches[0].food)) {
    const food = matches[0].food;
    const cal = calInput > 0 ? calInput : food.cal;
    addEntryData({ name: food.name, cal, fromDB: food });
    document.getElementById('inputFood').value = '';
    document.getElementById('inputCal').value = '';
    hideUnknownBanner();
    return;
  }

  const title = matches.length === 1
    ? `🥗 כמה גרם אכלת מ"${matches[0].food.name.split(',')[0]}"?`
    : `🍽️ זיהיתי ${matches.length} מאכלים — הוסף כמות:`;
  document.getElementById('mfTitle').textContent = title;
  showMultifoodCard(matches);
  document.getElementById('inputFood').value = '';
  document.getElementById('inputCal').value = '';
  hideUnknownBanner();
}

function addEntryData({ name, cal, fromDB }) {
  const entry = {
    id: Date.now(),
    name, cal,
    meal: selectedMeal,
    date: todayStr(),
    time: nowTime()
  };
  entries.unshift(entry);
  save();
  render();
  updateStats();
  toast('✅ נוסף: ' + name + (cal > 0 ? ' · ' + cal + ' קק"ל' : ''));

  // Show suggestions if available
  if (fromDB && fromDB.alts && fromDB.alts.length > 0) {
    showSuggestion(fromDB);
  } else {
    document.getElementById('suggestionCard').classList.remove('show');
  }
}

function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  save(); render(); updateStats();
  document.getElementById('suggestionCard').classList.remove('show');
  toast('🗑 נמחק');
}

// ═══════════════════════════════════════════
// SUGGESTIONS
// ═══════════════════════════════════════════
function showSuggestion(foodData) {
  const card = document.getElementById('suggestionCard');
  const items = document.getElementById('sugItems');
  const saving = a => foodData.cal - a.cal;

  items.innerHTML = foodData.alts.map(a => `
    <div class="sug-item">
      <div>
        <div class="sug-name">${a.name}</div>
        <div class="sug-portion">${a.portion} · ${a.note}</div>
      </div>
      <div class="sug-right">
        <div class="sug-cal">${a.cal} קק"ל</div>
        ${saving(a) > 0 ? `<div class="sug-save">חסכון: ${saving(a)} קק"ל</div>` : ''}
      </div>
    </div>
  `).join('');
  card.classList.add('show');
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeSuggestion() {
  document.getElementById('suggestionCard').classList.remove('show');
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function setFilter(f) {
  currentFilter = f;
  ['today','all'].forEach(x => document.getElementById('fb-'+x).classList.toggle('active', x === f));
  render();
}

function render() {
  const today = todayStr();
  let list = currentFilter === 'today'
    ? entries.filter(e => e.date === today)
    : entries;

  const el = document.getElementById('entriesList');
  if (list.length === 0) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🥗</div><div class="empty-title">${currentFilter==='today'?'אין רשומות להיום — לחץ על המיקרופון!':'אין רשומות עדיין'}</div></div>`;
    return;
  }

  // Group by date
  const byDate = {};
  list.forEach(e => { if (!byDate[e.date]) byDate[e.date] = []; byDate[e.date].push(e); });
  const dates = Object.keys(byDate).sort((a,b) => b.localeCompare(a));

  el.innerHTML = dates.map(date => {
    const dayEntries = byDate[date];
    const dayTotal = dayEntries.reduce((s,e) => s + e.cal, 0);
    const label = date === today ? 'היום' : fmtDateHe(date);
    return `
      <div class="day-header">
        <div class="day-label">📅 ${label}</div>
        <div class="day-total-badge">${dayTotal} קק"ל</div>
      </div>
      ${dayEntries.map(e => `
        <div class="entry-card ${e.meal==='drink'?'drink':''}">
          <div class="entry-icon">${MEAL_ICONS[e.meal]}</div>
          <div class="entry-body">
            <div class="entry-name">${esc(e.name)}</div>
            <div class="entry-meta">${e.time} · <span class="meal-tag ${e.meal}">${MEAL_LABELS[e.meal]}</span></div>
          </div>
          <div class="entry-right">
            <div class="entry-cal ${e.meal==='drink'?'drink-cal':''}">${e.cal}<span class="entry-cal-unit"> קק"ל</span></div>
          </div>
          <button class="del-btn" onclick="deleteEntry(${e.id})">🗑</button>
        </div>
      `).join('')}
    `;
  }).join('');
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ═══════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════
function updateStats() {
  const today = todayStr();
  const todayEntries = entries.filter(e => e.date === today);
  const todayCal = todayEntries.reduce((s,e) => s + e.cal, 0);
  const uniqueDays = new Set(entries.map(e => e.date)).size;
  document.getElementById('st-cal').textContent = todayCal;
  document.getElementById('st-entries').textContent = todayEntries.length;
  document.getElementById('st-days').textContent = uniqueDays;
}

// ═══════════════════════════════════════════
// EXCEL EXPORT  — each day = column group
// ═══════════════════════════════════════════
function doExport() {
  const XLSX = window.XLSX;
  if (!XLSX) { toast('⚠️ טוען...'); return; }

  // Group by date, sorted ascending
  const byDate = {};
  entries.forEach(e => { if (!byDate[e.date]) byDate[e.date] = []; byDate[e.date].push(e); });
  const dates = Object.keys(byDate).sort();

  if (dates.length === 0) { toast('⚠️ אין נתונים לייצא'); return; }

  // Find max entries per day
  const maxRows = Math.max(...dates.map(d => byDate[d].length));

  // Build AOA (Array Of Arrays)
  // Layout: per day = 3 columns: [שעה | מה אכלת | קק"ל]
  // Columns separated by blank col
  const colsPerDay = 3;
  const gapCols = 1;
  const totalCols = dates.length * colsPerDay + (dates.length - 1) * gapCols;

  // Row 0: Date headers (merged over 3 cols each)
  // Row 1: Sub-headers (שעה / מזון / קלוריות)
  // Row 2..N: data
  // Row N+1: total

  const numDataRows = maxRows + 3; // 2 header rows + data rows + 1 total row
  const aoa = Array.from({ length: numDataRows }, () => Array(totalCols).fill(''));

  const merges = [];
  const colStyles = {}; // track column styles

  dates.forEach((date, di) => {
    const baseCol = di * (colsPerDay + gapCols);
    const dayEntries = byDate[date];
    const dayTotal = dayEntries.reduce((s,e) => s + e.cal, 0);
    const today = todayStr();
    const label = date === today ? `היום (${date})` : fmtDateHe(date) + ` ${date}`;

    // Row 0: date header spanning 3 cols
    aoa[0][baseCol] = label;
    merges.push({ s: { r:0, c:baseCol }, e: { r:0, c:baseCol+colsPerDay-1 } });

    // Row 1: sub-headers
    aoa[1][baseCol] = 'שעה';
    aoa[1][baseCol+1] = 'מה אכלתי / שתיתי';
    aoa[1][baseCol+2] = 'קלוריות';

    // Rows 2+: data
    dayEntries.forEach((e, ri) => {
      const row = ri + 2;
      aoa[row][baseCol] = e.time;
      aoa[row][baseCol+1] = e.name;
      aoa[row][baseCol+2] = e.cal;
    });

    // Total row
    const totalRow = numDataRows - 1;
    aoa[totalRow][baseCol] = '';
    aoa[totalRow][baseCol+1] = 'סה"כ';
    aoa[totalRow][baseCol+2] = dayTotal;
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = merges;

  // Column widths
  const cols = [];
  dates.forEach((_, di) => {
    const baseCol = di * (colsPerDay + gapCols);
    cols[baseCol] = { wch: 7 };
    cols[baseCol+1] = { wch: 22 };
    cols[baseCol+2] = { wch: 9 };
    if (di < dates.length - 1) cols[baseCol+3] = { wch: 2 }; // gap
  });
  ws['!cols'] = cols;
  ws['!sheetViews'] = [{ rightToLeft: true }];

  // Apply styles
  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let R = range.s.r; R <= range.e.r; R++) {
    for (let C = range.s.c; C <= range.e.c; C++) {
      const addr = XLSX.utils.encode_cell({ r: R, c: C });
      if (!ws[addr]) ws[addr] = { v: '', t: 's' };

      // Determine which day this belongs to
      const dayIdx = Math.floor(C / (colsPerDay + gapCols));
      const colInDay = C % (colsPerDay + gapCols);
      const isGap = colInDay === colsPerDay;
      const isDateHeader = R === 0;
      const isSubHeader = R === 1;
      const isTotalRow = R === numDataRows - 1;
      const isCalCol = colInDay === 2;
      const isTimeCol = colInDay === 0;

      const dayColors = ['217346','1d4ed8','7c3aed','c2410c','0369a1','92400e','166534'];
      const dayColor = dayColors[dayIdx % dayColors.length];

      let font, fill, alignment;

      if (isGap) {
        fill = { fgColor: { rgb: 'f4f6fa' }, patternType: 'solid' };
        font = { sz: 9 };
        alignment = { horizontal: 'center', vertical: 'center' };
      } else if (isDateHeader) {
        font = { bold: true, sz: 12, color: { rgb: 'FFFFFF' } };
        fill = { fgColor: { rgb: dayColor }, patternType: 'solid' };
        alignment = { horizontal: 'center', vertical: 'center', readingOrder: 2 };
      } else if (isSubHeader) {
        font = { bold: true, sz: 10, color: { rgb: '1a1f36' } };
        fill = { fgColor: { rgb: 'dde2ec' }, patternType: 'solid' };
        alignment = { horizontal: 'center', vertical: 'center', readingOrder: 2 };
      } else if (isTotalRow) {
        font = { bold: true, sz: 11, color: { rgb: isCalCol ? dayColor : '1a1f36' } };
        fill = { fgColor: { rgb: 'f0fdf4' }, patternType: 'solid' };
        alignment = { horizontal: isCalCol ? 'center' : 'right', vertical: 'center', readingOrder: 2 };
      } else {
        const isEven = (R - 2) % 2 === 0;
        font = {
          sz: 10,
          bold: isCalCol,
          color: { rgb: isCalCol ? '16a34a' : isTimeCol ? '8896b3' : '1a1f36' }
        };
        fill = { fgColor: { rgb: isEven ? 'ffffff' : 'f9fffe' }, patternType: 'solid' };
        alignment = { horizontal: isCalCol ? 'center' : 'right', vertical: 'center', readingOrder: 2 };
      }

      ws[addr].s = {
        font, fill, alignment,
        border: isGap ? {} : {
          top: { style: 'thin', color: { rgb: 'dde2ec' } },
          bottom: { style: 'thin', color: { rgb: 'dde2ec' } },
          left: { style: 'thin', color: { rgb: 'dde2ec' } },
          right: { style: 'thin', color: { rgb: 'dde2ec' } }
        }
      };
    }
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'מעקב תזונה');
  wb.Workbook = { Views: [{ RTL: true }] };

  const dateStr = new Date().toLocaleDateString('he-IL').replace(/\//g, '-');
  XLSX.writeFile(wb, `מעקב_תזונה_${dateStr}.xlsx`);
  toast('📊 Excel יוצא בהצלחה!');
}

// ═══════════════════════════════════════════
// MULTI-FOOD CARD
// ═══════════════════════════════════════════
function isMohEntry(food) {
  return food.alts && food.alts.length === 0 && food.portion === '100 גרם';
}

let _mfMatches = [];

function showMultifoodCard(matches) {
  _mfMatches = matches.map((m, idx) => ({
    id: idx, food: m.food, grams: 100, isMoh: isMohEntry(m.food)
  }));
  renderMfItems();
  const card = document.getElementById('multifoodCard');
  card.classList.add('show');
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderMfItems() {
  document.getElementById('mfItems').innerHTML = _mfMatches.map(m => {
    const cal = Math.round(m.food.cal * m.grams / 100);
    return `
    <div class="mf-item">
      <div class="mf-item-name">${esc(m.food.name.split(',')[0])}</div>
      <input type="number" class="mf-gram-input" value="${m.grams}" min="1" max="9999"
        oninput="updateMfGrams(${m.id},this.value)">
      <span class="mf-gram-label">גרם</span>
      <div class="mf-item-cal" id="mf-cal-${m.id}">${cal} קק"ל</div>
      <button class="mf-remove" onclick="removeMfItem(${m.id})">✕</button>
    </div>`;
  }).join('');
  updateMfTotal();
}

function updateMfGrams(id, val) {
  const m = _mfMatches.find(x => x.id === id);
  if (!m) return;
  m.grams = Math.max(1, parseInt(val) || 1);
  const el = document.getElementById('mf-cal-' + id);
  if (el) el.textContent = Math.round(m.food.cal * m.grams / 100) + ' קק"ל';
  updateMfTotal();
}

function removeMfItem(id) {
  _mfMatches = _mfMatches.filter(m => m.id !== id);
  if (_mfMatches.length === 0) { closeMultifood(); return; }
  renderMfItems();
}

function updateMfTotal() {
  const total = _mfMatches.reduce((s, m) =>
    s + Math.round(m.food.cal * m.grams / 100), 0);
  document.getElementById('mfTotal').textContent = total;
}

function closeMultifood() {
  document.getElementById('multifoodCard').classList.remove('show');
  _mfMatches = [];
}

function confirmMultifood() {
  if (_mfMatches.length === 0) return;
  _mfMatches.forEach(m => {
    const cal = Math.round(m.food.cal * m.grams / 100);
    const displayName = `${m.food.name.split(',')[0]} (${m.grams}ג׳)`;
    addEntryData({ name: displayName, cal, fromDB: null });
  });
  closeMultifood();
}

// ═══════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
window.onload = () => {
  // Auto-select meal based on time
  selectedMeal = autoMeal();
  document.querySelectorAll('.meal-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.meal === selectedMeal);
  });

  initSpeech();
  render();
  updateStats();
};
