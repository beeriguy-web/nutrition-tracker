<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הזמנת עבודה | שמדר טכנולוגיות</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background: #eef2f7;
            font-family: Arial, 'Segoe UI', sans-serif;
            font-size: 15px;
        }

        /* ── Toolbar ── */
        .toolbar {
            background: #1a3a5c;
            color: #fff;
            padding: 10px 18px;
            position: sticky;
            top: 0;
            z-index: 200;
            box-shadow: 0 2px 8px rgba(0,0,0,.35);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .toolbar-title { font-size: 1.05rem; font-weight: 700; }
        .toolbar .btn { font-size: 0.85rem; padding: 6px 14px; }

        /* ── Card ── */
        .form-card {
            max-width: 860px;
            margin: 22px auto 60px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 3px 16px rgba(0,0,0,.1);
            overflow: hidden;
        }

        /* ── Form header ── */
        .form-header {
            background: #1a3a5c;
            color: #fff;
            padding: 18px 24px;
            text-align: center;
        }
        .form-header .co-name { font-size: 1.3rem; font-weight: 700; }
        .form-header .form-title { font-size: 0.95rem; opacity: .85; margin-top: 3px; }

        /* ── Section label ── */
        .sec-label {
            background: #e6edf5;
            border-right: 4px solid #1a3a5c;
            padding: 5px 12px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #1a3a5c;
            margin: 18px 0 10px;
            border-radius: 0 4px 4px 0;
        }

        .form-label { font-weight: 600; font-size: 0.88rem; color: #333; margin-bottom: 3px; }
        .form-control, .form-select {
            font-size: 0.9rem;
            border-color: #cfd8e3;
        }
        .form-control:focus {
            border-color: #1a3a5c;
            box-shadow: 0 0 0 .18rem rgba(26,58,92,.22);
        }
        .form-control[readonly] {
            background: #f4f7fb;
            color: #333;
        }

        /* ── Items table ── */
        #items-table { width: 100%; border-collapse: collapse; }
        #items-table th {
            background: #1a3a5c;
            color: #fff;
            padding: 7px 6px;
            font-size: 0.82rem;
            text-align: center;
            border: 1px solid #2a5080;
        }
        #items-table td { border: 1px solid #d0d8e4; padding: 6px 3px; }
        #items-table td input {
            border: none;
            width: 100%;
            padding: 5px 6px;
            font-size: 0.88rem;
            background: transparent;
            outline: none;
        }
        #items-table td input:focus { background: #f0f6ff; }
        .row-num { text-align: center; background: #f4f7fb; color: #888; font-size: 0.8rem; width: 36px; }
        #items-table tr:nth-child(even) td { background: #fafbfd; }

        /* ── Approval ── */
        .approval-wrap { border-top: 2px solid #1a3a5c; margin-top: 26px; padding-top: 4px; }

        /* ── Signature canvas ── */
        .sig-wrap {
            border: 2px solid #cfd8e3;
            border-radius: 6px;
            background: #fff;
            position: relative;
            overflow: hidden;
        }
        #sig-canvas {
            display: block;
            width: 100%;
            height: 130px;
            touch-action: none;
            cursor: crosshair;
        }
        .sig-clear-btn {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(190,40,40,.82);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 2px 10px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .sig-clear-btn:hover { background: #c00; }
        .sig-hint { font-size: 0.75rem; color: #999; margin-top: 3px; }

        /* ── Footer note ── */
        .form-footer { font-size: 0.72rem; color: #aaa; margin-top: 18px; text-align: left; direction: ltr; }

        /* ── Toast ── */
        .toast-msg {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a3a5c;
            color: #fff;
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity .3s;
            z-index: 999;
            pointer-events: none;
        }
        .toast-msg.show { opacity: 1; }

        @media (max-width: 600px) {
            .toolbar-title { font-size: 0.9rem; }
            .form-card { margin: 10px 6px 50px; border-radius: 8px; }
            #items-table th, #items-table td { font-size: 0.75rem; }
        }

        /* ── Print / Save-as-PDF styles ── */
        @media print {
            @page { margin: 12mm 10mm; }

            /* hide all interactive UI */
            .toolbar,
            .d-flex.gap-2.mt-2,
            .form-footer,
            .sig-clear-btn,
            .sig-hint,
            .toast-msg,
            #pdf-zone { display: none !important; }

            body { background: #fff !important; font-size: 11pt; margin: 0; }

            .form-card {
                box-shadow: none !important;
                margin: 0 !important;
                max-width: 100% !important;
                border-radius: 0 !important;
            }

            /* preserve background colors in print */
            .form-header,
            #items-table th,
            .sec-label {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .form-control {
                border: 1px solid #bbb !important;
                box-shadow: none !important;
            }

            #items-table { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

<!-- ════ TOOLBAR ════ -->
<div class="toolbar">
    <span class="toolbar-title">📋 טופס הזמנת עבודה פנימית</span>
    <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-outline-light" onclick="newForm()">טופס חדש</button>
        <button class="btn btn-outline-light" onclick="copyLink()" id="btn-share" title="העתק קישור לטופס לשיתוף עם עובדים">🔗 שתף קישור</button>
        <button class="btn btn-warning text-dark fw-bold" onclick="downloadPDF()">⬇ PDF</button>
        <button class="btn btn-success fw-bold" onclick="sendEmail()">✉ שלח במייל</button>
    </div>
</div>

<!-- ════ FORM CARD ════ -->
<div class="form-card" id="main-form">

    <div class="form-header">
        <div class="co-name">שמדר טכנולוגיות בע"מ</div>
        <div class="form-title">טופס הזמנת עבודה פנימית</div>
    </div>

    <div class="p-3 p-md-4">

        <!-- Meta row -->
        <div class="row g-3 mb-1">
            <div class="col-md-5">
                <label class="form-label">אל:</label>
                <input class="form-control" id="f-to" value="גל - מנהל משרד טכני">
            </div>
            <div class="col-md-4">
                <label class="form-label">מאת:</label>
                <input class="form-control" id="f-from" value="גיא בארי - מנהל מכירות ופרויקטים">
            </div>
            <div class="col-md-3">
                <label class="form-label">תאריך:</label>
                <input class="form-control" type="date" id="f-date">
            </div>
        </div>

        <!-- Client -->
        <div class="sec-label">פרטי לקוח ואתר</div>
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">שם לקוח:</label>
                <input class="form-control" id="f-client" placeholder="שם חברה / לקוח">
            </div>
            <div class="col-md-4">
                <label class="form-label">אתר:</label>
                <input class="form-control" id="f-site" placeholder="שם / כתובת האתר">
            </div>
            <div class="col-md-4">
                <label class="form-label">איש קשר:</label>
                <input class="form-control" id="f-contact" placeholder="שם מלא">
            </div>
            <div class="col-sm-4">
                <label class="form-label">טלפון 1:</label>
                <input class="form-control" type="tel" id="f-phone1" placeholder="05X-XXXXXXX">
            </div>
            <div class="col-sm-4">
                <label class="form-label">טלפון 2:</label>
                <input class="form-control" type="tel" id="f-phone2" placeholder="05X-XXXXXXX">
            </div>
            <div class="col-sm-4">
                <label class="form-label">מייל לקוח:</label>
                <input class="form-control" type="email" id="f-cemail" placeholder="email@domain.com">
            </div>
        </div>

        <!-- Work details (removed מיכלול) -->
        <div class="sec-label">פרטי עבודה</div>
        <div class="row g-3">
            <div class="col-sm-4">
                <label class="form-label">מספר עבודה:</label>
                <div class="input-group">
                    <span class="input-group-text">PR</span>
                    <input class="form-control" id="f-wnum" placeholder="25-41">
                    <span class="input-group-text">/@</span>
                </div>
            </div>
            <div class="col-sm-4">
                <label class="form-label">מועד אספקה:</label>
                <input class="form-control" type="date" id="f-delivery">
            </div>
            <div class="col-sm-4">
                <label class="form-label">הזמנת לקוח:</label>
                <input class="form-control" id="f-corder" placeholder="מספר / הפניה">
            </div>
        </div>

        <!-- Items table (removed מספר קטלוגי column) -->
        <div class="sec-label">פירוט פריטים</div>
        <div class="table-responsive">
            <table id="items-table">
                <thead>
                    <tr>
                        <th style="width:36px">#</th>
                        <th>תאור</th>
                        <th style="width:80px">כמות</th>
                        <th style="width:200px">הערות</th>
                    </tr>
                </thead>
                <tbody id="items-body"></tbody>
            </table>
        </div>
        <div class="d-flex gap-2 mt-2">
            <button class="btn btn-sm btn-outline-primary" onclick="addRow()">+ הוסף שורה</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="removeRow()">− הסר שורה</button>
        </div>

        <!-- Description -->
        <div class="sec-label">תיאור העבודה</div>
        <textarea class="form-control" id="f-desc" rows="5" placeholder="פרט את העבודה הנדרשת, הנחיות מיוחדות, הערות..."></textarea>

        <!-- Approval (removed date, auto-filled name, canvas signature) -->
        <div class="approval-wrap">
            <div class="sec-label">אישור</div>
            <div class="row g-3">
                <div class="col-sm-6">
                    <label class="form-label">מאושר ע"י:</label>
                    <input class="form-control" id="f-appr-by" value="גיא בארי" readonly>
                </div>
                <div class="col-sm-6">
                    <label class="form-label">תפקיד:</label>
                    <input class="form-control" id="f-appr-role" value="מנהל מח' מכירות ופרויקטים" readonly>
                </div>
                <div class="col-12">
                    <label class="form-label">חתימה:</label>
                    <div class="sig-wrap">
                        <canvas id="sig-canvas" width="800" height="180"></canvas>
                        <button type="button" class="sig-clear-btn" onclick="clearSignature()">מחק חתימה</button>
                    </div>
                    <div class="sig-hint">חתום בעזרת העכבר או האצבע</div>
                </div>
            </div>
        </div>

        <div class="form-footer">טופס מס': 27/06/2011 | גרסה דיגיטלית 2025</div>
    </div>
</div>

<!-- ════ TOAST ════ -->
<div class="toast-msg" id="toast"></div>

<!-- ════ PDF ZONE (off-screen, always in DOM) ════ -->
<div id="pdf-zone"></div>


<!-- ════ SCRIPTS ════ -->
<script>
/* ── init ── */
document.getElementById('f-date').valueAsDate = new Date();
for (let i = 0; i < 6; i++) addRow();

/* ── Signature pad ── */
(function () {
    const canvas = document.getElementById('sig-canvas');
    const ctx    = canvas.getContext('2d');
    let drawing  = false;
    let lastX = 0, lastY = 0;

    function pos(e) {
        const rect  = canvas.getBoundingClientRect();
        const scaleX = canvas.width  / rect.width;
        const scaleY = canvas.height / rect.height;
        const src = e.touches ? e.touches[0] : e;
        return [(src.clientX - rect.left) * scaleX,
                (src.clientY - rect.top)  * scaleY];
    }

    function startDraw(e) {
        drawing = true;
        [lastX, lastY] = pos(e);
    }
    function draw(e) {
        if (!drawing) return;
        const [x, y] = pos(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.strokeStyle = '#1a3a5c';
        ctx.lineWidth   = 2.8;
        ctx.lineCap     = 'round';
        ctx.lineJoin    = 'round';
        ctx.stroke();
        [lastX, lastY] = [x, y];
    }
    function endDraw() { drawing = false; }

    canvas.addEventListener('mousedown',  startDraw);
    canvas.addEventListener('mousemove',  draw);
    canvas.addEventListener('mouseup',    endDraw);
    canvas.addEventListener('mouseleave', endDraw);

    canvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(e); }, { passive: false });
    canvas.addEventListener('touchmove',  e => { e.preventDefault(); draw(e); },      { passive: false });
    canvas.addEventListener('touchend',   endDraw);
})();

function clearSignature() {
    const canvas = document.getElementById('sig-canvas');
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}

function getSignatureDataUrl() {
    const canvas = document.getElementById('sig-canvas');
    const blank  = document.createElement('canvas');
    blank.width  = canvas.width;
    blank.height = canvas.height;
    if (canvas.toDataURL() === blank.toDataURL()) return null;
    return canvas.toDataURL('image/png');
}

/* ── Share link ── */
function copyLink() {
    const url = window.location.href.split('?')[0];
    navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('btn-share');
        btn.textContent = '✓ הועתק!';
        toast('הקישור הועתק — אפשר לשלוח לעובדים ✓');
        setTimeout(() => { btn.innerHTML = '🔗 שתף קישור'; }, 2000);
    }).catch(() => {
        prompt('העתק את הקישור:', url);
    });
}

/* ── Row management (no מספר קטלוגי) ── */
function addRow() {
    const tbody = document.getElementById('items-body');
    const n = tbody.rows.length + 1;
    const tr = document.createElement('tr');
    tr.innerHTML =
        `<td class="row-num">${n}</td>
         <td><input type="text" placeholder="תאור הפריט / עבודה"></td>
         <td><input type="number" min="0" placeholder="0" style="text-align:center"></td>
         <td><input type="text" placeholder="הערות"></td>`;
    tbody.appendChild(tr);
}

function removeRow() {
    const tbody = document.getElementById('items-body');
    if (tbody.rows.length > 1) tbody.deleteRow(tbody.rows.length - 1);
}

/* ── Helpers ── */
function v(id) { return (document.getElementById(id)?.value || '').trim(); }
function wnum() { const n = v('f-wnum'); return n ? `PR${n}/@` : ''; }

function fmtDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
}

function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2800);
}

function collectRows() {
    const rows = [];
    document.querySelectorAll('#items-body tr').forEach((tr, i) => {
        const inp = [...tr.querySelectorAll('input')].map(x => x.value.trim());
        rows.push({ n: i + 1, desc: inp[0], qty: inp[1], notes: inp[2] });
    });
    return rows;
}

function newForm() {
    if (!confirm('לאפס את הטופס ולהתחיל מחדש?')) return;
    ['f-client','f-site','f-contact','f-phone1','f-phone2','f-cemail',
     'f-wnum','f-delivery','f-corder','f-desc'].forEach(id => {
        document.getElementById(id).value = '';
    });
    document.getElementById('f-date').valueAsDate  = new Date();
    document.getElementById('f-to').value          = 'גל - מנהל משרד טכני';
    document.getElementById('f-from').value        = 'גיא בארי - מנהל מכירות ופרויקטים';
    document.getElementById('f-appr-by').value     = 'גיא בארי';
    document.getElementById('items-body').innerHTML = '';
    for (let i = 0; i < 6; i++) addRow();
    clearSignature();
}

/* ── PDF ── */
function buildPdfHTML() {
    const rows    = collectRows();
    const sigData = getSignatureDataUrl();

    //   = non-breaking space character — html2canvas cannot collapse it
    const S   = ' ';
    // sp() replaces every regular space in dynamic values with NBSP
    const sp  = s => (s || '').replace(/ /g, ' ');
    const secStyle = 'background:#e6edf5;border-right:4px solid #1a3a5c;padding:4px 10px;font-weight:700;margin:10px 0 6px;color:#1a3a5c;direction:rtl;';
    const tdStyle  = 'padding:4px 6px;vertical-align:top;direction:rtl;';
    const lbl = text => `<b>${text}:</b>${S}`;

    const rowsHTML = rows.map(r =>
        `<tr>
            <td style="text-align:center;border:1px solid #bcc;padding:8px 4px;">${r.n}</td>
            <td style="border:1px solid #bcc;padding:8px 6px;">${sp(r.desc)}</td>
            <td style="text-align:center;border:1px solid #bcc;padding:8px 4px;">${r.qty}</td>
            <td style="border:1px solid #bcc;padding:8px 6px;">${sp(r.notes)}</td>
         </tr>`
    ).join('');

    const signatureHTML = sigData
        ? `<img src="${sigData}" style="max-height:70px;max-width:220px;display:block;margin-top:4px;">`
        : `<span style="color:#bbb;font-style:italic;">${S}לא${S}נחתם</span>`;

    return `
    <div style="direction:rtl;font-family:Arial,sans-serif;font-size:13px;color:#111;background:#fff;">

      <!-- Header -->
      <div style="background:#1a3a5c;color:#fff;padding:14px 18px;text-align:center;margin-bottom:16px;">
        <div style="font-size:1.25em;font-weight:700;">שמדר${S}טכנולוגיות${S}בע"מ</div>
        <div style="font-size:0.9em;margin-top:3px;opacity:.85;">טופס${S}הזמנת${S}עבודה${S}פנימית</div>
      </div>

      <!-- Meta -->
      <table style="width:100%;margin-bottom:12px;border-collapse:collapse;">
        <tr>
          <td style="width:40%;${tdStyle}">${lbl('אל')}${sp(v('f-to'))}</td>
          <td style="width:35%;${tdStyle}">${lbl('מאת')}${sp(v('f-from'))}</td>
          <td style="width:25%;${tdStyle}">${lbl('תאריך')}${fmtDate(v('f-date'))}</td>
        </tr>
      </table>

      <!-- Client -->
      <div style="${secStyle}">פרטי${S}לקוח${S}ואתר</div>
      <table style="width:100%;margin-bottom:10px;border-collapse:collapse;">
        <tr>
          <td style="width:34%;${tdStyle}">${lbl('לקוח')}${sp(v('f-client'))}</td>
          <td style="width:33%;${tdStyle}">${lbl('אתר')}${sp(v('f-site'))}</td>
          <td style="width:33%;${tdStyle}">${lbl('איש קשר')}${sp(v('f-contact'))}</td>
        </tr>
        <tr>
          <td style="${tdStyle}">${lbl('טלפון 1')}${v('f-phone1')}</td>
          <td style="${tdStyle}">${lbl('טלפון 2')}${v('f-phone2')}</td>
          <td style="${tdStyle}">${lbl('מייל')}${v('f-cemail')}</td>
        </tr>
      </table>

      <!-- Work details (no מיכלול) -->
      <div style="${secStyle}">פרטי${S}עבודה</div>
      <table style="width:100%;margin-bottom:10px;border-collapse:collapse;">
        <tr>
          <td style="width:33%;${tdStyle}">${lbl("מס' עבודה")}${wnum()}</td>
          <td style="width:34%;${tdStyle}">${lbl('מועד אספקה')}${fmtDate(v('f-delivery'))}</td>
          <td style="width:33%;${tdStyle}">${lbl('הזמנת לקוח')}${sp(v('f-corder'))}</td>
        </tr>
      </table>

      <!-- Items (no מספר קטלוגי) -->
      <div style="${secStyle}">פירוט${S}פריטים</div>
      <table style="width:100%;margin-bottom:12px;border-collapse:collapse;">
        <thead>
          <tr style="background:#1a3a5c;color:#fff;">
            <th style="padding:6px 4px;width:36px;border:1px solid #2a5080;text-align:center;">#</th>
            <th style="padding:6px;border:1px solid #2a5080;">תאור</th>
            <th style="padding:6px;width:60px;border:1px solid #2a5080;text-align:center;">כמות</th>
            <th style="padding:6px;width:180px;border:1px solid #2a5080;">הערות</th>
          </tr>
        </thead>
        <tbody>${rowsHTML}</tbody>
      </table>

      <!-- Description -->
      <div style="${secStyle}">תיאור${S}העבודה</div>
      <div style="border:1px solid #ccc;padding:10px;min-height:70px;white-space:pre-wrap;word-break:break-word;margin-bottom:14px;">${sp(v('f-desc'))}</div>

      <!-- Approval (no date) -->
      <div style="border-top:2px solid #1a3a5c;padding-top:10px;margin-top:10px;">
        <div style="${secStyle}">אישור</div>
        <table style="width:100%;border-collapse:collapse;">
          <tr>
            <td style="width:50%;${tdStyle}">${lbl('מאושר ע"י')}${sp(v('f-appr-by'))}</td>
            <td style="width:50%;${tdStyle}">${lbl('תפקיד')}${sp(v('f-appr-role'))}</td>
          </tr>
          <tr>
            <td colspan="2" style="${tdStyle}">
              <b>חתימה:</b><br>${signatureHTML}
            </td>
          </tr>
        </table>
      </div>

      <!-- Footer -->
      <div style="margin-top:18px;color:#999;font-size:0.75em;text-align:left;direction:ltr;">
        טופס מס': 27/06/2011 | גרסה דיגיטלית 2025
      </div>
    </div>`;
}

function downloadPDF() {
    const content = buildPdfHTML();
    const win = window.open('', '_blank');
    win.document.write(`<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Heebo', Arial, sans-serif !important; box-sizing: border-box; }
  body { margin: 0; padding: 0; background: #fff; direction: rtl; }
  @media print { @page { margin: 12mm 10mm; } }
</style>
</head>
<body>
${content}
<script>
  window.addEventListener('load', function() {
    setTimeout(function() {
      window.print();
      window.onafterprint = function() { window.close(); };
    }, 400);
  });
<\/script>
</body>
</html>`);
    win.document.close();
    toast('שמור כ-PDF בחלון שנפתח ✓');
}

/* ── Email ── */
function buildEmailBody() {
    const rows     = collectRows().filter(r => r.desc || r.qty);
    const rowLines = rows.map(r =>
        `${r.n}. ${r.desc}${r.qty ? ' | כמות: ' + r.qty : ''}${r.notes ? ' | ' + r.notes : ''}`
    ).join('\n');

    return `שלום גל,

מצורפת הזמנת עבודה פנימית לביצוע. אנא ראה PDF מצורף.

━━━━━━━━━━━━━━━━━━━
לקוח:        ${v('f-client')}
אתר:          ${v('f-site')}
איש קשר:     ${v('f-contact')}  ${v('f-phone1')}${v('f-phone2') ? ' / ' + v('f-phone2') : ''}
━━━━━━━━━━━━━━━━━━━
מספר עבודה:  ${wnum()}
מועד אספקה:  ${fmtDate(v('f-delivery'))}
הזמנת לקוח:  ${v('f-corder')}
━━━━━━━━━━━━━━━━━━━
${rowLines ? 'פירוט פריטים:\n' + rowLines + '\n━━━━━━━━━━━━━━━━━━━\n' : ''}
תיאור העבודה:
${v('f-desc')}
━━━━━━━━━━━━━━━━━━━

בברכה,
${v('f-from')}`;
}

function sendEmail() {
    const subject = encodeURIComponent(
        `הזמנת עבודה – ${v('f-client')} – מס' ${wnum()} – ${fmtDate(v('f-date'))}`
    );
    const body = encodeURIComponent(buildEmailBody());
    window.location.href = `mailto:guy@smdrtech.co.il?subject=${subject}&body=${body}`;
}
</script>
